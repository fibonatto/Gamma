[package]
name = "gamma-lean"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "gamma"
path = "src/main.rs"

[dependencies]
blake3 = "1.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
